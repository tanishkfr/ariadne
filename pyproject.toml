[build-system]
requires = []
build-backend = "ariadne_backend"
backend-path = ["build_backend"]

[project]
name = "ariadne"
dynamic = ["version"]
description = "Creative-production workflow runtime and managed Codex skill"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
ariadne = "ariadne.cli:main"

[project.urls]
Homepage = "https://github.com/tanishkfr/ariadne"
Repository = "https://github.com/tanishkfr/ariadne"
Changelog = "https://github.com/tanishkfr/ariadne/blob/main/CHANGELOG.md"
